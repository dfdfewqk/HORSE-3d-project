name: V17.1 public website actual Chrome smoke
on:
  push:
    branches: [v17-1-anatomical-gait-rebuild, work/v171-game-ready-motion-20261027]
    paths: ['v17-1-preview/site-smoke.cjs','.github/workflows/v171-site-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify separate game-ready preview, original model and all four gaits
        env:
          SITE_URL: https://dfdfewqk.github.io/HORSE-3d-project/game-motion-preview/v17-1-preview/
        run: node v17-1-preview/site-smoke.cjs
