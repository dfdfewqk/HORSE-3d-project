name: V17.1 actual GLB 4-gait QA
on:
  push:
    branches: [v17-1-anatomical-gait-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start GLB viewer
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v170server.log 2>&1 &
      - name: Execute 1280 frame real-GLB and four V17 buttons
        run: node v17-1-preview/automated-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v171-browser-QA
          path: v171-artifacts/
