name: V17.1 actual GLB 4-gait QA
on:
  push:
    branches: [v17-1-anatomical-gait-rebuild, work/v171-contact-ik-20261026]
  pull_request:
    paths: ['v17-1-preview/**', '.github/workflows/v171-actual-glb.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Execute contact, continuity and four-mode browser regressions
        run: RUN_GEOMETRY_AUDIT=1 STRICT_GEOMETRY=1 node v17-1-preview/automated-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v171-browser-QA
          path: v171-artifacts/
