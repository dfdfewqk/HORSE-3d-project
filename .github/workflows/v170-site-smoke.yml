name: V17.0 public website actual Chrome smoke
on:
  push:
    branches: [v17-0-biomechanics-integration]
    paths: ['v17-0-biomechanics-preview/site-smoke.cjs','.github/workflows/v170-site-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify full V17 site, model, all motion buttons
        run: node v17-0-biomechanics-preview/site-smoke.cjs
