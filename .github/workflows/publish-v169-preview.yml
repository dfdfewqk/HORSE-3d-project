name: Publish HORSE RANCH V17.0 public browser preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v169-preview.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: horse-ranch-public-preview-pages
  cancel-in-progress: true

jobs:
  publish-v169:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v17-0-biomechanics-preview/
    steps:
      - name: Check out V17.0 preview source, keep main animation files intact
        uses: actions/checkout@v4
        with:
          ref: v17-0-biomechanics-integration
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload real GLB viewer and animation assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: v170-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for auto-generated default Pages run to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 32); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=30" --jq "[.workflow_runs[] | select(.name == \"pages build and deployment\" and .head_sha == \"${GITHUB_SHA}\")][0].status // \"completed\"")"
            echo "Default Pages run status: $state"
            if [ "$state" = "completed" ]; then break; fi
            sleep 5
          done
      - name: Deploy browser-viewable preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: v170-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preview URL
        run: echo "Site -> ${{ steps.deployment.outputs.page_url }}v17-0-biomechanics-preview/"
