name: Publish HORSE RANCH V16.9 public browser preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v169-preview.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: horse-ranch-public-preview-pages
  cancel-in-progress: true

jobs:
  publish-v169:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v16-9-biomechanics-preview/
    steps:
      - name: Check out V16.9 preview source, leave main game files unchanged
        uses: actions/checkout@v4
        with:
          ref: v16-9-biomechanics-preview
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload real GLB viewer and animation assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy browser-viewable preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Preview URL
        run: echo "Site -> ${{ steps.deployment.outputs.page_url }}v16-9-biomechanics-preview/"
