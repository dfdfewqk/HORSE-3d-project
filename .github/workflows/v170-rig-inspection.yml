name: V17.0 GLB rig inspection
on:
  push:
    branches: [v17-0-biomechanics-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve original GLB in local browser
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v170server.log 2>&1 &
      - name: Inspect rig actual 19 bone controls
        run: node v17-0-biomechanics-preview/rig-inspect.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v170-rig-evidence
          path: v170-artifacts/
