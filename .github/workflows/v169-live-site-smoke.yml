name: Check public V16.9 3D viewer
on:
  push:
    branches: [v16-9-biomechanics-preview]
    paths: ['v16-9-biomechanics-preview/site-smoke.cjs','.github/workflows/v169-live-site-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node v16-9-biomechanics-preview/site-smoke.cjs