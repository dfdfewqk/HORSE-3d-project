name: Publish HORSE RANCH V17.1 public browser preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v171-preview.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: horse-ranch-public-preview-pages
  cancel-in-progress: true

jobs:
  publish-v171-kinematic-pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v17-1-preview/
    steps:
      - name: Check out V17.1 preview source, keep main animation files intact
        uses: actions/checkout@v4
        with:
          ref: v17-1-anatomical-gait-rebuild
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Ensure only V17.1 preview pages remain
        run: |
          test -f v17-1-preview/index.html
          test -f legacy-v7.html
          ! test -e v16-8-full-gait-preview/index.html
          ! test -e v16-9-biomechanics-preview/index.html
          ! test -e v16-7-full-gait-preview/index.html
          ! test -e v17-0-biomechanics-preview/index.html
          test -f v16-7-full-gait-preview/gait-runtime.js
      - name: Log current motion source commit
        run: |
          echo "V17.1 phase → hoof target → coordinated whole-limb IK → support body → real GLB validation"
          git rev-parse HEAD
          test -f v17-1-preview/gait-cycle.js
          grep -q 'function phaseTimeline' v17-1-preview/gait-cycle.js
          grep -q 'function hoofTrajectory' v17-1-preview/gait-cycle.js
          grep -q 'function solveLimbs' v17-1-preview/gait-cycle.js
          grep -q 'function bodyFromSupport' v17-1-preview/gait-cycle.js
          grep -q 'phase-foot-trajectory-coordinated-IK-body-validation' v17-1-preview/gait-cycle.js
      - name: Check out Walk contact IK candidate separately
        uses: actions/checkout@v4
        with:
          ref: work/v171-contact-ik-20261026
          path: __walk_contact_source
          persist-credentials: false
      - name: Add isolated candidate browser preview without modifying released V17.1
        run: |
          set -euo pipefail
          test -f __walk_contact_source/legacy-v7.html
          test -f __walk_contact_source/v17-1-preview/contact-model.js
          test -f __walk_contact_source/v17-1-preview/contact-clips.json
          test -f __walk_contact_source/v17-1-preview/index.html
          mkdir -p walk-contact-preview
          cp -a __walk_contact_source/. walk-contact-preview/
          rm -rf walk-contact-preview/.git walk-contact-preview/.github
          rm -rf __walk_contact_source
          test -f walk-contact-preview/v17-1-preview/contact-clips.json
          test -f walk-contact-preview/v17-1-preview/gait-cycle.js
          test -f v17-1-preview/gait-cycle.js
          echo "Released V17.1 remains under /v17-1-preview/"
          echo "Walk test candidate under /walk-contact-preview/v17-1-preview/"
      - name: Check out isolated game-ready four-gait branch
        uses: actions/checkout@v4
        with:
          ref: work/v171-game-ready-motion-20261027
          path: __game_motion_source
          persist-credentials: false
      - name: Install separate game-ready preview, preserving current and contact versions
        run: |
          set -euo pipefail
          test -f __game_motion_source/legacy-v7.html
          test -f __game_motion_source/v17-1-preview/index.html
          grep -q 'relaxed four-beat' __game_motion_source/v17-1-preview/gait-cycle.js
          mkdir -p game-motion-preview
          cp -a __game_motion_source/. game-motion-preview/
          rm -rf game-motion-preview/.git game-motion-preview/.github __game_motion_source
          test -f game-motion-preview/v17-1-preview/automated-qa.cjs
          test -f walk-contact-preview/v17-1-preview/index.html
          test -f v17-1-preview/index.html
          echo "Experimental game-ready preview: /game-motion-preview/v17-1-preview/"
      - name: Upload real GLB viewer and animation assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: v171-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for auto-generated default Pages run to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 32); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=30" --jq "[.workflow_runs[] | select(.name == \"pages build and deployment\" and .head_sha == \"${GITHUB_SHA}\")][0].status // \"completed\"")"
            echo "Default Pages run status: $state"
            if [ "$state" = "completed" ]; then break; fi
            sleep 5
          done
      - name: Deploy browser-viewable preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: v171-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preview URLs
        run: |
          echo "Current release: ${{ steps.deployment.outputs.page_url }}v17-1-preview/"
          echo "Separate Walk test: ${{ steps.deployment.outputs.page_url }}walk-contact-preview/v17-1-preview/"
          echo "Separate game motion: ${{ steps.deployment.outputs.page_url }}game-motion-preview/v17-1-preview/"
