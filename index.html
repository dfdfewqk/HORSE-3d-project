<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HORSE RANCH 3D · 네 가지 모션</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#08121b;color:#eef4fa;font:14px system-ui,'Malgun Gothic',sans-serif}
iframe{display:block;width:100%;height:100%;border:0}
#controls{position:absolute;z-index:15;top:12px;left:12px;max-width:calc(100% - 24px);background:#0e2533ed;border:1px solid #65849b;border-radius:12px;padding:12px 14px;display:grid;gap:9px;box-shadow:0 12px 30px #0005}
#controls strong{color:#f3d9a0;font-size:15px}
#buttons{display:flex;gap:5px;flex-wrap:wrap}
button{border-radius:8px;background:#23475b;border:1px solid #607f91;color:#f5f8fa;padding:9px 11px;font:inherit;cursor:pointer}
button[aria-pressed="true"]{background:#665033;border-color:#efcb82}
label{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input{accent-color:#a1ccdf;width:min(250px,50vw)}
small{color:#b4c6d1}
#error{display:none;color:#ffe0cb;background:#532c30e8;padding:8px 10px;border-radius:6px}
@media(max-width:600px){#controls{font-size:12px;padding:9px;gap:5px}button{padding:7px}}
</style></head><body>
<div id="controls">
 <strong>HORSE RANCH · 4가지 모션</strong>
 <div id="buttons">
 <button type="button" data-speed="28" aria-pressed="false">걷기</button>
 <button type="button" data-speed="44" aria-pressed="false">일반 질주</button>
 <button type="button" data-speed="55" aria-pressed="false">고속 질주</button>
 <button type="button" data-speed="65" aria-pressed="false">스퍼트</button>
 </div>
 <label>속도 <input id="raceSpeed" type="range" min="20" max="72" step="1" value="44"><span id="speedNumber">44 km/h</span></label>
 <small id="status" role="status">3D 모델 및 모션 불러오는 중…</small>
 <div id="error" role="alert"></div>
</div>
<iframe id="viewer" src="./legacy-v7.html" title="HORSE RANCH 3D 경주마 움직임"></iframe>
<script>
(function(){'use strict';
 const iframe=document.getElementById('viewer'),slider=document.getElementById('raceSpeed');
 const status=document.getElementById('status'),count=document.getElementById('speedNumber');
 const err=document.getElementById('error'),buttons=Array.from(document.querySelectorAll('[data-speed]'));
 const fail=(message)=>{err.style.display='block';err.textContent=message;status.textContent='시험판 로딩 실패';};
 function update(){
   const v=Number(slider.value);count.textContent=v+' km/h';
   const api=iframe.contentWindow?.__horseFourGaits;
   if(!api?.ready)return;
   try{
     const m=api.setSpeed(v);
     buttons.forEach(b=>b.setAttribute('aria-pressed',String(
       ({28:'walk',44:'cruise',55:'fast',65:'sprint'})[Number(b.dataset.speed)]===m.mode
     )));
     status.textContent='현재 '+({walk:'걷기',cruise:'일반 질주',fast:'고속 질주',sprint:'스퍼트'})[m.mode]
       +' · 동작 주기 '+m.period.toFixed(2)+'초';
   }catch(e){fail('속도 전환 오류: '+e.message);}
 }
 slider.addEventListener('input',update);
 buttons.forEach(btn=>btn.addEventListener('click',()=>{slider.value=btn.dataset.speed;update();}));
 iframe.addEventListener('load',()=>{
   const doc=iframe.contentDocument;
   if(!doc){fail('같은 출처에서 뷰어를 읽을 수 없습니다.');return;}
   const script=doc.createElement('script');
   script.src='./four-gaits.js';
   script.onerror=()=>fail('모션 코드를 읽지 못했습니다.');
   doc.body.appendChild(script);
   let countChecks=0;
   const polling=setInterval(()=>{
     const win=iframe.contentWindow;
     if(win?.__horseFourGaits?.ready){clearInterval(polling);update();return;}
     const error=win?.__horseFourGaitsError||win?.__horseV14Error||
       win?.__horseV139Error||win?.__horseV138Error||win?.__horseV137Error||
       win?.__horseV135FoldError||win?.__horseV13_2Error||win?.__horseV13Error||win?.__horseV12Error;
     if(error){clearInterval(polling);fail('애니메이션 오류: '+error);return;}
     if(++countChecks>700){clearInterval(polling);fail('모션을 준비하지 못했습니다.');}
   },120);
 });
})();
</script></body></html>
