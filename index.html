<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORSE RANCH V12 · 네 다리 Gallop 개선</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08121b;color:#e9eef4;font-family:system-ui,sans-serif}iframe{display:block;width:100%;height:100%;border:0}#warning{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:9;background:#472d26;padding:9px 15px;border-radius:8px}</style></head><body><div id="warning" role="alert"></div><iframe id="horse" src="./legacy-v7.html" title="HORSE RANCH V12 경주마 애니메이션"></iframe><script>(function(){const frame=document.getElementById('horse');function fail(msg){let x=document.getElementById('warning');x.style.display='block';x.textContent=msg;}frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;if(!doc){fail('비교 모델을 불러올 수 없습니다.');return;}const script=doc.createElement('script');script.src='./gallop-v12.js';script.onerror=()=>fail('V12 동작 파일을 불러올 수 없습니다.');doc.body.appendChild(script);let checks=0;const id=setInterval(()=>{try{let w=frame.contentWindow;if(w?.__horseGaitV12){clearInterval(id);}else if(w?.__horseV12Error){clearInterval(id);fail('V12: '+w.__horseV12Error);}else if(++checks>650){clearInterval(id);fail('V12 동작 준비 시간 초과. 새로고침 해 주세요.');}}catch(e){clearInterval(id);fail(e.message)}},120);}catch(e){fail('V12 로드 오류: '+e.message);}})})();</script></body></html>
