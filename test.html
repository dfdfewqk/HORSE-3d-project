<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>HORSE RANCH | Gallop 비교 실험실</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#08111b;color:#eef4fa;font:14px/1.45 system-ui,sans-serif}header{min-height:78px;padding:12px 20px;background:#102333;border-bottom:1px solid #38536b;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:19px;margin:0 0 4px;color:#f3d7a4}p{font-size:12px;color:#b8c9d7;margin:0}.badge{color:#f6dcac;border:1px solid #947a4d;padding:6px 10px;border-radius:99px;font-size:12px}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}button{background:#24455a;border:1px solid #64849e;color:white;border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit}button:disabled{opacity:.4;cursor:default}button.active{border-color:#f1c783;background:#685137}#notice{padding:8px 20px;background:#1b302e;color:#d1e9e0;font-size:12px;min-height:34px}iframe{width:100%;height:calc(100% - 135px);border:0;display:block}a{color:#f1d099}@media(max-width:760px){iframe{height:calc(100% - 196px)}header{padding:9px}}
</style></head><body><header><div><h1>HORSE RANCH · Gallop 비교 실험실</h1><p>기존 V7과 뒷다리 회수·관절 굽힘 실험안 비교 · 실제 원본 456본 수정본이 아님</p></div><div class="actions"><button disabled id="base">기존 Gallop</button><button disabled id="v7">V7 수정 후보</button><button disabled id="trial">회수 굽힘 실험</button><span class="badge">테스트 전용</span></div></header><div id="notice">GitHub의 기존 3D 모델을 불러오는 중…</div><iframe id="viewer" src="./index.html" title="기존 HORSE RANCH 3D 뷰어"></iframe><script>
const frame=document.getElementById('viewer'),note=document.getElementById('notice');
const btns=[document.getElementById('base'),document.getElementById('v7'),document.getElementById('trial')];
const helper=String.raw`(()=>{
 if(!window.__viewerReady||!object3d)return;
 if(window.__horseTrialReady)return;
 const g=object3d,base=g.animations.find(x=>x.name==='Gallop_HIND_FLEX_CANDIDATE_PREVIEW');
 if(!base){window.__horseTrialError='기존 V7 Gallop 비교 애니메이션이 없음';return;}
 const experiment={name:'Gallop_SWING_FLEX_TEST_ONLY',duration:base.duration,channels:base.channels.map(ch=>({node:ch.node,path:ch.path,sam:{times:ch.sam.times,data:new Float32Array(ch.sam.data),interpolation:ch.sam.interpolation}}))};
 let edits=0;
 for(const ch of experiment.channels){if(ch.path!=='rotation')continue;
  const name=g.doc.nodes[ch.node]?.name||'';
  const m=/^Hind([LR])_(Stifle|Hock|Fetlock)$/.exec(name);if(!m)continue;
  const side=m[1],joint=m[2],sam=ch.sam,dur=base.duration;
  const center=side==='L'?0.77:0.52,width=.29;
  const deg={Stifle:-13,Hock:11,Fetlock:-2.5}[joint];
  for(let i=0;i<sam.times.length;i++){
   const phase=(sam.times[i]%dur)/dur;
   let delta=Math.abs(phase-center);delta=Math.min(delta,1-delta);
   const x=Math.min(1,delta/width),envelope=Math.pow(Math.max(0,1-x*x),2);
   let j=i*4,q=sam.data,old=2*Math.atan2(q[j],q[j+3]);
   let angle=old+deg*Math.PI/180*envelope;
   q[j]=Math.sin(angle/2);q[j+1]=0;q[j+2]=0;q[j+3]=Math.cos(angle/2);
  }
  edits++;
 }
 if(edits!==6){window.__horseTrialError='필요한 뒷다리 채널 수 불일치: '+edits;return;}
 g.animations.push(experiment);
 const opt=document.createElement('option');opt.value=String(g.animations.length-1);opt.textContent=experiment.name+' (시험용)';animSel.append(opt);
 window.__horseTrialReady=true;
 window.__horseTrialSelect=(name)=>{let i=g.animations.findIndex(a=>a.name===name);if(i<0)return false;animSel.value=String(i);animSel.dispatchEvent(new Event('change'));return true;};
 window.__horseTrialNames=g.animations.map(x=>x.name);
})();`;
let armed=false,tries=0;
function ready(){try{
 const win=frame.contentWindow;
 if(!win||!win.__viewerReady)return;
 if(!armed){const s=frame.contentDocument.createElement('script');s.textContent=helper;frame.contentDocument.body.appendChild(s);armed=true;}
 if(win.__horseTrialError){note.textContent='실험판 초기화 실패: '+win.__horseTrialError;return;}
 if(win.__horseTrialReady){btns.forEach(b=>b.disabled=false);note.textContent='원본 파일은 변경하지 않습니다. 비교 실험은 현재 브라우저 메모리에서만 수행됩니다. 0.25배속·측면 시점으로 비교하세요.';select('v7');return;}
}catch(e){note.textContent='뷰어 연결 오류: '+e.message;}}
function select(mode){let name=({base:'Gallop_PREVIEW',v7:'Gallop_HIND_FLEX_CANDIDATE_PREVIEW',trial:'Gallop_SWING_FLEX_TEST_ONLY'})[mode];if(frame.contentWindow.__horseTrialSelect?.(name)){btns.forEach(b=>b.classList.toggle('active',b.id===mode));note.textContent=mode==='trial'?'새 곡선: 뒷다리 회수 구간에만 슬관절·비절 굽힘 추가. 실제 접지 검증 전 실험안입니다.':'비교 중: '+(mode==='v7'?'기존 V7 수정 후보':'기존 임시 Gallop')+' · 아래 원래 뷰어에서 속도와 시점을 조작할 수 있습니다.';}}
btns.forEach(b=>b.addEventListener('click',()=>select(b.id)));
let poll=setInterval(()=>{if(frame.contentWindow?.__horseTrialReady){clearInterval(poll);return;}if(tries++>80){clearInterval(poll);note.textContent='기존 뷰어 로드가 지연됩니다. 새로고침 후 다시 확인하세요.';return;}ready();},500);
</script></body></html>
