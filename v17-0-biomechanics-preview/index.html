<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HORSE RANCH V17.0 | 말 전신 걷기와 질주</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#081623;color:#ebf3fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
iframe{width:100%;height:100%;border:0;display:block}
#bar{position:fixed;z-index:10;left:0;right:0;top:0;min-height:73px;background:#0b2432f5;
 padding:11px 17px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:1px solid #406177}
#brand{font-size:16px;letter-spacing:.05em;white-space:nowrap;margin-right:10px}
#brand small{font-size:11px;color:#b1c6d6;margin-left:5px}
#actions{display:flex;flex-wrap:wrap;gap:6px}
button,select{border:1px solid #63879b;background:#163747;color:#e8f6ff;border-radius:7px;padding:8px 11px;
 font:500 13px system-ui;cursor:pointer;min-height:37px}
button[aria-pressed=true]{background:#19705d;border-color:#99e9c1;color:#fff;font-weight:700}
button:disabled{cursor:wait;opacity:.45}
#utility{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto}
#status{position:fixed;z-index:10;left:14px;bottom:13px;max-width:calc(100vw - 28px);
 border-radius:8px;background:#0b2432ec;border:1px solid #456779;padding:7px 11px;font-size:13px}
#status[data-mode=error]{background:#5c3029}
#status[data-mode=v17]{border-color:#56ae8c}
#detail{position:fixed;z-index:12;right:14px;bottom:14px;width:min(430px,calc(100vw - 28px));
 padding:8px 10px;background:#102634e9;border-radius:8px;border:1px solid #486d83;font-size:12px;
 max-height:60vh;overflow:auto}
#detail:not([open]){width:auto;opacity:.88}
#detail summary{cursor:pointer}
#detail pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.5}
#error{position:fixed;top:88px;left:12px;z-index:25;background:#74392d;color:white;
 border:1px solid #c7866d;border-radius:7px;padding:12px;display:none;max-width:90vw}
@media(max-width:770px){
 #bar{padding:8px;gap:7px}#brand{font-size:13px;margin-right:2px}
 #actions{gap:4px}button,select{padding:7px;min-height:33px;font-size:11px}
 #utility{margin-left:0}#status{bottom:7px;font-size:11px}
 #detail{right:7px;bottom:56px}
}
</style></head><body>
<iframe id="viewer" src="../legacy-v7.html" title="HORSE RANCH V17.0 실제 GLB 3D 모델"></iframe>
<header id="bar">
 <strong id="brand">HORSE RANCH <small>V17.0 · 3D</small></strong>
 <nav id="actions" aria-label="말 동작 선택">
  <button data-v17-mode="idle" disabled>정지</button>
  <button data-v17-mode="walk" disabled>Walk</button>
  <button data-v17-mode="cruise" disabled>Gallop Cruise</button>
  <button data-v17-mode="fast" disabled>Gallop Fast</button>
  <button data-v17-mode="sprint" disabled>Gallop Sprint</button>
 </nav>
 <div id="utility">
  <button id="play" disabled>⏸ 일시정지</button>
  <label style="font-size:12px">배속 <select id="rate" disabled>
   <option value="0.5">0.5×</option><option value="1" selected>1×</option>
   <option value="1.5">1.5×</option><option value="2">2×</option>
  </select></label>
  <label style="font-size:12px">시점 <select id="camera">
   <option value="right">우측</option><option value="left">좌측</option>
   <option value="quarter">45°</option><option value="front">정면</option>
   <option value="rear">후면</option>
  </select></label>
 </div>
</header>
<output id="status" data-mode="loading" role="status" aria-live="polite">V17.0 실제 말 모델과 모션 준비 중…</output>
<details id="detail" hidden>
 <summary>V17.0 검증 · 실험 상태</summary>
 <p>현재 관절 19개, 독립 발굽 관절 없음. 피부·지지발 미끄러짐 수치 검사 미통과. 정식 애니메이션 아님.</p>
 <button id="auditButton" disabled>V17.0 실제 GLB 1280프레임 검사</button>
 <pre id="auditOutput">검사 미실행</pre>
</details>
<div id="error" role="alert"></div>
<script>
(function(){'use strict';
const outer=document.getElementById('viewer'),status=document.getElementById('status'),
 buttons=[...document.querySelectorAll('[data-v17-mode]')],
 playBtn=document.getElementById('play'),rate=document.getElementById('rate'),
 cam=document.getElementById('camera'),err=document.getElementById('error'),
 info=document.getElementById('detail'),audit=document.getElementById('auditButton'),
 report=document.getElementById('auditOutput');
const showDev=new URLSearchParams(location.search).has('debug');
if(showDev)info.hidden=false;
let running=false;
function error(message){
 const content=String(message);
 status.dataset.mode='error';status.textContent='실행 오류: '+content;
 err.textContent=content;err.style.display='block';
}
outer.addEventListener('load',()=>{
 const d=outer.contentDocument,w=outer.contentWindow;
 if(!d||!w)return error('3D 원본 뷰어에 접근할 수 없습니다');
 // Historical legacy controls are internal and no longer offered to users.
 const hide=d.createElement('style');
 hide.textContent='#animations,#speed,#play{visibility:hidden!important;pointer-events:none!important}';
 d.head.appendChild(hide);
 const paths=[
     "../v14-preview/horse-gaits-runtime.js",
     "../v15-preview/v15-motion.js",
     "../v15-preview/v15-hair.js",
     "../v15-preview/v15-skin-qa.js",
     "../v16-walk-preview/walk-foot-targets.js",
     "../v16-walk-preview/walk-ik.js",
     "../v16-walk-preview/walk-motion.js",
     "../v16-walk-preview/walk-qa.js",
     "../v16-1-walk-preview/walk-foot-targets.js",
     "../v16-1-walk-preview/walk-ik.js",
     "../v16-1-walk-preview/walk-motion.js",
     "../v16-1-walk-preview/walk-qa.js",
     "../v16-2-walk-preview/walk-reference.js",
     "../v16-2-walk-preview/walk-foot-contact.js",
     "../v16-2-walk-preview/walk-body-motion.js",
     "../v16-2-walk-preview/walk-limb-ik.js",
     "../v16-2-walk-preview/walk-motion.js",
     "../v16-2-walk-preview/walk-secondary-motion.js",
     "../v16-2-walk-preview/walk-qa.js",
     "../v16-2-walk-preview/walk-visual-qa.js",
     "../v16-3-walk-preview/walk-reference.js",
     "../v16-3-walk-preview/walk-foot-contact.js",
     "../v16-3-walk-preview/walk-body-motion.js",
     "../v16-3-walk-preview/walk-limb-ik.js",
     "../v16-3-walk-preview/walk-motion.js",
     "../v16-3-walk-preview/walk-secondary-motion.js",
     "../v16-3-walk-preview/walk-qa.js",
     "../v16-3-walk-preview/walk-visual-qa.js",
     "../v16-4-walk-preview/walk-reference.js",
     "../v16-4-walk-preview/walk-foot-contact.js",
     "../v16-4-walk-preview/walk-body-motion.js",
     "../v16-4-walk-preview/walk-limb-ik.js",
     "../v16-4-walk-preview/walk-motion.js",
     "../v16-4-walk-preview/walk-secondary-motion.js",
     "../v16-4-walk-preview/walk-qa.js",
     "../v16-4-walk-preview/walk-visual-qa.js",
     "../v16-5-walk-preview/walk-reference.js",
     "../v16-5-walk-preview/walk-foot-contact.js",
     "../v16-5-walk-preview/walk-body-motion.js",
     "../v16-5-walk-preview/walk-limb-ik.js",
     "../v16-5-walk-preview/walk-motion.js",
     "../v16-5-walk-preview/walk-secondary-motion.js",
     "../v16-5-walk-preview/walk-qa.js",
     "../v16-5-walk-preview/walk-visual-qa.js",
     "../v16-6-walk-preview/walk-leg-drive.js",
     "../v16-6-walk-preview/walk-motion.js",
     "../v16-7-full-gait-preview/gait-builder.js",
     "../v16-7-full-gait-preview/gait-runtime.js",
     "./viewer-bridge.js",
     "./gait-solver.js",
     "./gait-audit.js"
 ];
 let cursor=0,loadFailed=false;
 function next(){
  if(cursor===paths.length)return;
  const p=paths[cursor],script=d.createElement('script');
  script.src=new URL(p,location.href).href;
  script.onload=()=>{cursor++;next()};
  script.onerror=()=>{loadFailed=true;error('필수 실행 파일을 읽지 못했습니다: '+p)};
  d.body.appendChild(script);
 }
 next();
 let attempts=0;
 const wait=setInterval(()=>{
  if(loadFailed){clearInterval(wait);return}
  const problem=w.__horseV170Error||w.__horseV170BridgeError||w.__horseV167Error||
   w.__horseV166Error||w.__horseV165Error||w.__horseV164Error||w.__horseV163Error||
   w.__horseV15Error||w.__horseV14Error||w.__horseV12Error;
  if(problem){clearInterval(wait);error(problem);return}
  if(!w.__horseV170?.ready||!w.__horseV170Bridge?.ready||!w.__horseV170QA?.run){
   if(++attempts>1300){clearInterval(wait);error('V17.0 모델 초기화 시간 초과')}
   return;
  }
  clearInterval(wait);
  const bridge=w.__horseV170Bridge;
  function sync(){
   const s=bridge.snapshot();
   buttons.forEach(b=>{
    b.disabled=false;
    b.setAttribute('aria-pressed',String(b.dataset.v17Mode===s.mode));
   });
   const label={idle:'정지',walk:'Walk',cruise:'Gallop Cruise',
    fast:'Gallop Fast',sprint:'Gallop Sprint'}[s.mode]||'로드 중';
   status.dataset.mode='v17';
   status.textContent='HORSE RANCH V17.0 | '+label+
    ' | '+(s.playing?'재생 중':'일시정지')+' | '+s.speed.toFixed(2)+'×'+
    ' | 실험 클립 (수치 검증 미통과)';
   playBtn.disabled=s.mode==='idle';
   playBtn.textContent=s.playing?'⏸ 일시정지':'▶ 재생';
   rate.disabled=false;rate.value=String(s.speed);
   return s;
  }
  const perform=fn=>{try{fn();sync()}catch(e){error(e.message||e)}};
  for(const button of buttons)button.onclick=()=>perform(()=>{
   const mode=button.dataset.v17Mode,r=bridge.choose(mode);
   if(r.mode!==mode||r.version!=='v17')throw Error('V17.0 클립 전환 실패: '+mode);
  });
  playBtn.onclick=()=>perform(()=>bridge.setPlaying(!bridge.snapshot().playing));
  rate.onchange=()=>perform(()=>bridge.setSpeed(Number(rate.value)));
  const views={right:[Math.PI/2,.12],left:[-Math.PI/2,.12],quarter:[Math.PI/4,.16],
   front:[0,.12],rear:[Math.PI,.12]};
  cam.onchange=()=>perform(()=>{
   const [yaw,pitch]=views[cam.value];
   w.eval('yaw='+yaw+';pitch='+pitch+';');
  });
  audit.disabled=false;
  audit.onclick=async()=>{
   if(running)return;running=true;audit.disabled=true;
   report.textContent='원본 GLB 1280프레임 확인 중…';
   try{
    const data=await w.__horseV170QA.run(p=>{report.textContent='검사 '+Math.round(p*100)+'%'});
    const max=(m,key)=>Math.max(...Object.values(m.feet).map(f=>f[key])),
     stretch=m=>Math.max(m.edge.fore.max,m.edge.hind.max);
    const rows=[],bad=[];
    for(const mode of ['walk','cruise','fast','sprint']){
     const s=data.modes[mode],pen=max(s,'worstPenetration'),
      slide=max(s,'maxTravelCorrectedStanceSlip'),edge=stretch(s);
     rows.push(mode+': 관통 '+(1000*pen).toFixed(1)+'mm · 지지발 편차 '+
      (1000*slide).toFixed(1)+'mm · 피부 신장 '+edge.toFixed(3)+'배');
     if(pen>.005||slide>.015||edge>1.2)bad.push(mode);
    }
    report.textContent=rows.join('\n')+'\n결과: '+(bad.length?'FAIL ('+bad.join(', ')+')':
      '수치 목표 잠정 충족, 시각검증 필요');
   }catch(e){report.textContent='검사 실패: '+String(e.message||e)}
   finally{running=false;audit.disabled=false}
  };
  // Enter only the newest Walk. Old gait previews are internal legacy data.
  perform(()=>bridge.choose('walk'));
  setInterval(()=>{if(outer.isConnected&&w.__viewerReady)try{sync()}catch(e){error(e.message||e)}},240);
 },100);
});
})();
</script></body></html>
