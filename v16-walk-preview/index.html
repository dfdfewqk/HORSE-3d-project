<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HORSE RANCH V16 · Walk 보행 개선 후보</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08121b}
iframe{display:block;border:0;width:100%;height:100%}
#notice{position:fixed;z-index:20;top:10px;left:50%;transform:translateX(-50%);max-width:95%;
 font:13px/1.5 system-ui,sans-serif;padding:9px 13px;border-radius:8px;color:white;
 background:#502a24;display:none}
</style></head><body>
<iframe id="viewer" src="../legacy-v7.html" title="기존 HORSE RANCH 3D 뷰어"></iframe>
<div id="notice" role="status"></div>
<script>
(function(){'use strict';
 const iframe=document.getElementById('viewer'),notice=document.getElementById('notice');
 function show(s,bad=true){notice.textContent=s;notice.style.display='block';notice.style.background=bad?'#502a24':'#204b40';}
 iframe.addEventListener('load',()=>{
  const doc=iframe.contentDocument;if(!doc){show('기존 뷰어를 읽지 못했습니다.');return;}
  const paths=['../v14-preview/horse-gaits-runtime.js','../v15-preview/v15-motion.js',
   '../v15-preview/v15-hair.js','../v15-preview/v15-skin-qa.js',
   './walk-foot-targets.js','./walk-ik.js','./walk-motion.js','./walk-qa.js'];
  let loading=0,failed=false;
  function attach(){if(loading>=paths.length)return;
   const p=paths[loading],script=doc.createElement('script');script.src=new URL(p,location.href).href;
   script.onerror=()=>{failed=true;show('V16 의존 파일 로딩 실패: '+p);};
   script.onload=()=>{loading++;attach();};doc.body.appendChild(script);
  }attach();
  let checks=0;
  const poll=setInterval(()=>{
   if(failed){clearInterval(poll);return;}
   const w=iframe.contentWindow;
   const error=w?.__horseV16Error||w?.__horseV15Error||w?.__horseV15HairError||w?.__horseV14Error||
    w?.__horseV139Error||w?.__horseV138Error||w?.__horseV137Error||w?.__horseV13Error||w?.__horseV12Error;
   if(error){clearInterval(poll);show('V16 초기화 오류: '+error);return;}
   if(w?.__horseV16?.ready&&w?.__horseV16QA?.run){
    clearInterval(poll);
    const options=[...doc.getElementById('animations').options].map(x=>x.textContent.trim());
    if(options.join('|')!=='정지 자세|Walk|Gallop Cruise|Gallop Fast|Gallop Sprint'){
     show('동작 목록 보존 실패');return;
    }
    if(w.__horseGaitV12?.belly?.corrected!==440||w.__horseV16?.joints!==19){show('원본 데이터 무결성 확인 실패');return;}
    const title=doc.querySelector('#header h1');if(title)title.textContent='HORSE RANCH V16 · Walk 발굽 기반 IK 후보';
    const sub=doc.getElementById('subtitle');if(sub)sub.textContent='Walk만 변경 · 기존 질주 3종·외형·갈기·꼬리 유지';
    const note=doc.getElementById('note');if(note)note.textContent='Walk 목표 궤적+제한적 IK 시험 · Chrome 시각 검증 및 실제 접지는 별도 확인';
    window.__horseV16=w.__horseV16;window.__horseV16QA=w.__horseV16QA;
    window.__horseV16Check=()=>({modes:options,rigJoints:w.__horseV16.joints,
     ground:w.__horseV16.groundY,proxy:w.__horseV16.proxyMetrics,
     skin:w.__horseV16QA.result,originalGallopsUnchanged:w.__horseV16.otherClipsUnchanged});
    if(new URLSearchParams(location.search).has('audit')){
     show('V15/V16 실제 GLB 160프레임 비교 검사 중…',false);
     w.__horseV16QA.run(progress=>notice.textContent='GLB 검사 '+Math.round(progress*100)+'%')
      .then(result=>{const a=result.baselineAndCandidate,b=a.baseline,c=a.candidate;
       show('V16 검사 완료 · 앞다리 최대 신장 '+b.edge.fore.max.toFixed(3)+' → '+c.edge.fore.max.toFixed(3)+
        '배 · 뒷다리 '+b.edge.hind.max.toFixed(3)+' → '+c.edge.hind.max.toFixed(3)+
        '배 · 실제 Chrome 시각 검증은 별도',false);
      }).catch(e=>show('검사 실패: '+(e?.message||e)));
    }
    return;
   }
   if(++checks>950){clearInterval(poll);show('V16 초기화 시간이 초과되었습니다.');}
  },120);
 });
})();
</script></body></html>
