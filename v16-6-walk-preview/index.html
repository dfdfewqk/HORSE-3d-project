<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HORSE RANCH V16.6 · 네 다리 관절 실제 연결 검사</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:13px/1.48 system-ui,sans-serif;background:#08131c;color:#e3f0f9}
iframe{border:0;width:100%;height:100%;display:block}
#hud{position:fixed;z-index:25;top:12px;right:12px;display:flex;gap:5px;background:#112d40ee;border:1px solid #66869c;border-radius:9px;padding:6px}
button{border:1px solid #86abc3;border-radius:6px;background:#25485b;color:white;cursor:pointer;padding:8px 12px;font-weight:600}
button[aria-pressed=true]{background:#1b7d85;border-color:#91dee3}
button:disabled{opacity:.5;cursor:wait}
#report{position:fixed;z-index:24;bottom:12px;left:12px;max-height:49vh;overflow:auto;
 width:min(440px,calc(100vw - 24px));background:#0b2031ee;border:1px solid #587994;border-radius:9px;padding:12px;box-shadow:0 4px 18px #0006}
#report h2{font-size:14px;margin:0 0 7px}
#report table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#report th,#report td{border-bottom:1px solid #355065;padding:4px 3px;text-align:left}
#report td:nth-child(n+2){text-align:right}
#notice{position:fixed;top:61px;right:12px;z-index:30;max-width:min(480px,90vw);background:#673d2f;color:#fff;border-radius:7px;padding:10px;display:none}
small{color:#a8c0d3}a{color:#a1d6f7}
#details{font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:80px;overflow:auto}
</style></head><body>
<iframe id="viewer" src="../legacy-v7.html" title="기존 원본 19본 GLB 뷰어"></iframe>
<div id="hud"><button id="old" type="button" disabled aria-pressed="false">이전 Walk V16.5</button><button id="new" type="button" disabled aria-pressed="true">새 Walk V16.6</button></div>
<section id="report"><button type="button" id="toggleReport" style="float:right;padding:3px 7px;font-size:11px">검사 접기</button><h2>네 다리 실제 관절 채널 검사</h2>
<div id="status">원본 뷰어와 보행 코드 로딩 중…</div>
<table><thead><tr><th>다리</th><th>이전과 최대 차이</th><th>평균 변화</th><th>피부 연결</th></tr></thead><tbody id="legs"><tr><td colspan="4">검사 대기</td></tr></tbody></table>
<small>관절의 회전 데이터와 실제 GLB 피부 가중치 연결을 검사합니다. 수치 통과는 실제 화면에서 자연스러운 보행을 증명하지 않습니다.</small>
<div style="margin-top:7px"><a href="../v16-5-walk-preview/?audit" target="_blank" rel="noopener">이전 V16.3~V16.5 GLB 접지·변형 수치 확인</a></div>
<div id="details"></div></section><div id="notice" role="alert"></div>
<script>
(function(){'use strict';
const iframe=document.getElementById('viewer'),old=document.getElementById('old'),fresh=document.getElementById('new'),
 status=document.getElementById('status'),table=document.getElementById('legs'),notice=document.getElementById('notice');
function error(message){notice.textContent=message;notice.style.display='block';status.textContent='오류 또는 확인 불가';}
document.getElementById('toggleReport').onclick=()=>{
 const panel=document.getElementById('report'),open=panel.dataset.collapsed!=='1';
 panel.dataset.collapsed=open?'1':'0';
 panel.querySelector('table').style.display=open?'none':'table';
 panel.querySelector('small').style.display=open?'none':'block';
 panel.querySelector('div[style]').style.display=open?'none':'block';
 document.getElementById('details').style.display=open?'none':'block';
 document.getElementById('toggleReport').textContent=open?'검사 펼치기':'검사 접기';
};
iframe.addEventListener('load',()=>{
 const doc=iframe.contentDocument,w=iframe.contentWindow;
 if(!doc||!w){error('동일 출처 원본 뷰어 접근 실패');return;}
 const paths=[
     "../v14-preview/horse-gaits-runtime.js",
     "../v15-preview/v15-motion.js",
     "../v15-preview/v15-hair.js",
     "../v15-preview/v15-skin-qa.js",
     "../v16-walk-preview/walk-foot-targets.js",
     "../v16-walk-preview/walk-ik.js",
     "../v16-walk-preview/walk-motion.js",
     "../v16-walk-preview/walk-qa.js",
     "../v16-1-walk-preview/walk-foot-targets.js",
     "../v16-1-walk-preview/walk-ik.js",
     "../v16-1-walk-preview/walk-motion.js",
     "../v16-1-walk-preview/walk-qa.js",
     "../v16-2-walk-preview/walk-reference.js",
     "../v16-2-walk-preview/walk-foot-contact.js",
     "../v16-2-walk-preview/walk-body-motion.js",
     "../v16-2-walk-preview/walk-limb-ik.js",
     "../v16-2-walk-preview/walk-motion.js",
     "../v16-2-walk-preview/walk-secondary-motion.js",
     "../v16-2-walk-preview/walk-qa.js",
     "../v16-2-walk-preview/walk-visual-qa.js",
     "../v16-3-walk-preview/walk-reference.js",
     "../v16-3-walk-preview/walk-foot-contact.js",
     "../v16-3-walk-preview/walk-body-motion.js",
     "../v16-3-walk-preview/walk-limb-ik.js",
     "../v16-3-walk-preview/walk-motion.js",
     "../v16-3-walk-preview/walk-secondary-motion.js",
     "../v16-3-walk-preview/walk-qa.js",
     "../v16-3-walk-preview/walk-visual-qa.js",
     "../v16-4-walk-preview/walk-reference.js",
     "../v16-4-walk-preview/walk-foot-contact.js",
     "../v16-4-walk-preview/walk-body-motion.js",
     "../v16-4-walk-preview/walk-limb-ik.js",
     "../v16-4-walk-preview/walk-motion.js",
     "../v16-4-walk-preview/walk-secondary-motion.js",
     "../v16-4-walk-preview/walk-qa.js",
     "../v16-4-walk-preview/walk-visual-qa.js",
     "../v16-5-walk-preview/walk-reference.js",
     "../v16-5-walk-preview/walk-foot-contact.js",
     "../v16-5-walk-preview/walk-body-motion.js",
     "../v16-5-walk-preview/walk-limb-ik.js",
     "../v16-5-walk-preview/walk-motion.js",
     "../v16-5-walk-preview/walk-secondary-motion.js",
     "../v16-5-walk-preview/walk-qa.js",
     "../v16-5-walk-preview/walk-visual-qa.js",
     "./walk-leg-drive.js",
     "./walk-motion.js"
 ];
 let ptr=0,failed=false;
 const attach=()=>{
  if(ptr>=paths.length)return;
  const path=paths[ptr],tag=doc.createElement('script');tag.src=new URL(path,location.href).href;
  tag.onload=()=>{ptr++;attach();};tag.onerror=()=>{failed=true;error('필수 코드 로딩 실패: '+path);};
  doc.body.appendChild(tag);
 };
 attach();
 let waiting=0;
 const poll=setInterval(()=>{
  const err=w.__horseV166Error||w.__horseV165Error||w.__horseV164Error||w.__horseV163Error||
    w.__horseV161Error||w.__horseV16Error||w.__horseV15Error||w.__horseV14Error||w.__horseV12Error;
  if(failed||err){clearInterval(poll);if(err)error(String(err));return;}
  if(!w.__horseV166?.ready){if(++waiting>950){clearInterval(poll);error('애니메이션 로딩 시간 초과');}return;}
  clearInterval(poll);const run=w.__horseV166;
  const entries=Object.entries(run.jointMetrics);
  table.replaceChildren();
  const fmt=x=>Number.isFinite(x)?x.toFixed(1)+'°':'측정 불가';
  let allGood=true;
  for(const [key,metrics] of entries){
   const linked=run.skinWeights[key].filter(x=>x.skinnedVertices>0).length,
    tr=document.createElement('tr');
   const vals=[key,fmt(metrics.maxChangeDeg),fmt(metrics.avgRmsChangeDeg),linked+'/'+metrics.joints.length];
   for(const v of vals){const td=document.createElement('td');td.textContent=v;tr.appendChild(td);}
   table.appendChild(tr);
   if(linked!==metrics.joints.length||metrics.maxChangeDeg<3||metrics.maxFrameStepDeg>24)allGood=false;
  }
  status.textContent=(allGood?'14개 관절 채널 생성·피부 연결 확인':'관절 데이터에 추가 검토 필요')+
    ' · 이전 버전으로 되돌린 다리 없음';
  const list=run.previousLegFallbacks||[];
  document.getElementById('details').textContent='V16.5에서 이전 동작 복귀 대상: '+(list.length?list.join(', '):'기록 없음')+
   '\nV16.6 새 다리 4개 / 수정 관절 채널 14개 · 실제 GLB 브라우저 GPU 화면은 별도 확인 필요';
  const title=doc.querySelector('#header h1');if(title)title.textContent='HORSE RANCH V16.6 · Walk 다리 재구성';
  const sub=doc.getElementById('subtitle');if(sub)sub.textContent='목/머리와 별도로 앞·뒷다리 14개 관절을 직접 움직입니다';
  const selected=doc.getElementById('animations');
  function choose(which){
   const index=which==='old'?run.v165ClipIndex:run.clipIndex;
   selected.value=String(index);selected.dispatchEvent(new Event('change'));
   old.setAttribute('aria-pressed',String(which==='old'));
   fresh.setAttribute('aria-pressed',String(which==='new'));
   status.textContent=(which==='new'?'V16.6 재구성 Walk':'V16.5 이전 Walk')+
    ' 선택됨 · 다리 14채널 새 데이터 / 이전 버전 비교';
  }
  old.disabled=false;fresh.disabled=false;old.onclick=()=>choose('old');fresh.onclick=()=>choose('new');
  choose('new');
  if(!allGood)error('주의: 일부 관절 변화량·피부 연결이 검증 기준에 못 미쳤습니다. 실제 동작을 확인해야 합니다.');
 },120);
});
})();
</script></body></html>
